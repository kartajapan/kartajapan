<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanska Fraser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body {
            background: #f4f5f7;
            color: #111;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 700px; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .back-link {
            color: #333;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 14px;
            background: #e2e6ea;
            border-radius: 6px;
        }
        .back-link:hover { background: #d6dbe0; }
        h1 { font-size: 1.8rem; }
        .phrase-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .phrase-card {
            background: white;
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
        }
        .sv { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
        .jp { font-size: 1.2rem; color: #d9381e; font-weight: 600; }
        .romaji { color: #555; font-size: 0.95rem; font-style: italic; margin-top: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1>Japanska fraser</h1>
        <a href="index.html" class="back-link">← Startsidan</a>
    </div>

    <div class="phrase-list">
        <!-- Kopiera detta block för att lägga till fler fraser -->
        <div class="phrase-card">
            <div class="sv">Hej / God dag</div>
            <div class="jp">こんにちは</div>
            <div class="romaji">Konnichiwa</div>
        </div>

        <div class="phrase-card">
            <div class="sv">Tack så mycket</div>
            <div class="jp">ありがとうございます</div>
            <div class="romaji">Arigatou gozaimasu</div>
        </div>

        <div class="phrase-card">
            <div class="sv">Ursäkta mig / Förlåt</div>
            <div class="jp">すみません</div>
            <div class="romaji">Sumimasen</div>
        </div>
    </div>
</div>

</body>
</html>
